dataset:
  name: helical_sorted
  output_root: .
  copy_mode: copy            # copy | symlink
  include_original: true
  overwrite: false
  split_ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  shuffle: false              # set to false to keep sorted order when applying split ratios
  shuffle_seed: 42
  naming:
    delimiter: "__"
    force_lowercase: true

sources:
  - microrobot: helical
    splits: [train, val, test]


augmentations:
  - name: intensity_noise
    copies: 1
    transforms:
      - type: clahe
        probability: 0.4
        params:
          clip_limit: 2.0
          tile_grid_size: 8
      - type: speckle_noise
        probability: 0.6
        params:
          std: 0.07
      - type: gamma
        probability: 0.5
        params:
          gamma_range: [0.9, 1.1]
      - type: gaussian_noise
        probability: 0.3
        params:
          sigma_max: 0.02

  - name: motion_affine
    copies: 1
    transforms:
      - type: affine
        probability: 1.0
        params:
          rotate: 5
          scale: 0.1
          translate: 0.05
      - type: motion_blur
        probability: 0.5
        params:
          kernel: 5

  - name: stretch
    copies: 1
    transforms:
      - type: anisotropic_scale
        probability: 0.5
        params:
          scale_limit: 0.08
